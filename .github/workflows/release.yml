name: Draft Windows release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-release:
    name: build-windows-release
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Resolve release version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ((node -p "require('./package.json').version") -ne $version) { throw "Tag and package version differ" }
          "NESTFORM_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install and verify source
        run: |
          npm ci
          npm run runtime:install
          npm run bootstrap:win
          npm run native:build
          npm run verify
          npm audit --audit-level=high
      - name: Build Windows packages
        run: npm run release:win
      - name: Build source, SBOM, licences, and checksums
        shell: pwsh
        run: |
          $directory = "release/$env:NESTFORM_VERSION"
          npm run source:win -- -Version $env:NESTFORM_VERSION -OutputDirectory $directory
          npm sbom --sbom-format cyclonedx | Out-File "$directory/Nestform-$env:NESTFORM_VERSION.cdx.json" -Encoding utf8
          Compress-Archive -Path LICENSE,COPYRIGHT.md,BRAND-USAGE.md,THIRD-PARTY-NOTICES.md,LICENSE-Boost-1.0.txt,LICENSE-MIT-upstream.txt -DestinationPath "$directory/Nestform-$env:NESTFORM_VERSION-Licences.zip" -CompressionLevel Optimal
          $files = Get-ChildItem -LiteralPath $directory -File | Where-Object Name -Match '^Nestform-.+\.(exe|zip|json)$'
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash
            "$hash  $($file.Name)"
          }
          $lines | Sort-Object | Set-Content -LiteralPath "$directory/SHA256SUMS.txt" -Encoding ascii
          Copy-Item CHANGELOG.md "$directory/CHANGELOG.md"
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            release/${{ env.NESTFORM_VERSION }}/Nestform-Setup-${{ env.NESTFORM_VERSION }}.exe
            release/${{ env.NESTFORM_VERSION }}/Nestform-${{ env.NESTFORM_VERSION }}-Windows.exe
            release/${{ env.NESTFORM_VERSION }}/Nestform-${{ env.NESTFORM_VERSION }}-Source.zip
            release/${{ env.NESTFORM_VERSION }}/Nestform-${{ env.NESTFORM_VERSION }}.cdx.json
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $directory = "release/$env:NESTFORM_VERSION"
          $assets = @(
            "$directory/Nestform-Setup-$env:NESTFORM_VERSION.exe",
            "$directory/Nestform-$env:NESTFORM_VERSION-Windows.exe",
            "$directory/Nestform-$env:NESTFORM_VERSION-Source.zip",
            "$directory/Nestform-$env:NESTFORM_VERSION.cdx.json",
            "$directory/Nestform-$env:NESTFORM_VERSION-Licences.zip",
            "$directory/SHA256SUMS.txt",
            "$directory/CHANGELOG.md"
          )
          $notes = ".github/release-notes/${{ github.ref_name }}.md"
          if (-not (Test-Path -LiteralPath $notes)) { $notes = "CHANGELOG.md" }
          if (gh release view "${{ github.ref_name }}" 2>$null) {
            gh release upload "${{ github.ref_name }}" @assets --clobber
          } else {
            gh release create "${{ github.ref_name }}" @assets --draft --verify-tag --title "Nestform $env:NESTFORM_VERSION" --notes-file $notes
          }
