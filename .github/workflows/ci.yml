name: Windows verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-windows:
    name: verify-windows
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Install Electron runtime
        run: npm run runtime:install
      - name: Download and verify Boost
        run: npm run bootstrap:win
      - name: Build native engine
        run: npm run native:build
      - name: Verify DCO sign-off
        if: github.event_name == 'pull_request'
        run: node scripts/check-dco.cjs
      - name: Verify application
        run: npm run verify
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-verification-logs
          path: |
            *.log
            native/**/*.log
          if-no-files-found: ignore
          retention-days: 7
