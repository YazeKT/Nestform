name: Nestform CodeQL configuration

# Scan maintained application and native-engine source. These exclusions scope
# interpreted JavaScript that is generated, downloaded during CI, used only by
# local debugger harnesses, or retained but not loaded by the engine page.
# The traced C++ build still analyzes the native wrapper and included Boost headers.
paths-ignore:
  - out/**
  - vendor/boost_1_62_0/**
  - scripts/compare-images.mjs
  - scripts/conversion-smoke.mjs
  - scripts/reference-parity.mjs
  - scripts/smoke.mjs
  - src/renderer/public/engine/util/eval.js
  - src/renderer/public/engine/util/ractive.js
  - src/renderer/public/engine/util/svgpanzoom.js
